  <g transform="translate(150 135)"><circle cx="72" cy="72" r="72" fill="#fff"/><rect x="33" y="45" width="78" height="54" rx="15" fill="#4B2C70"/><path d="M47 65h45M47 80h29" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M72 116V74m0 0 17 17M72 74 55 91" fill="none" stroke="#E45768" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="72" cy="72" r="72" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4"/></g>
  <text x="330" y="185" fill="#F8F5FB" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" letter-spacing="3">CSIS IT SUPPORT</text><text x="330" y="235" fill="#D9C9E7" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="2">NORTH-WEST UNIVERSITY</text>
  <text x="150" y="500" fill="#F4C8D0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" letter-spacing="5">A SERVICE DESK FOR REAL WORK</text><text x="150" y="650" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="122" font-weight="900">Support that</text><text x="150" y="790" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="122" font-weight="900">stays in</text><text x="150" y="930" fill="#F5C6CE" font-family="Arial,Helvetica,sans-serif" font-size="122" font-weight="900">motion.</text>
  <text x="154" y="1010" fill="#E6DDEE" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500">One secure place to report, route, work and resolve every request.</text><rect x="150" y="1040" width="368" height="66" rx="33" fill="#E45768"/><text x="334" y="1082" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing="1">MAKE SUPPORT VISIBLE</text>
  <g filter="url(#shadow)"><rect x="1390" y="205" width="900" height="830" rx="34" fill="url(#panel)"/><rect x="1390" y="205" width="900" height="94" rx="34" fill="#26113f"/><rect x="1390" y="260" width="900" height="39" fill="#26113f"/><circle cx="1440" cy="252" r="12" fill="#E45768"/><circle cx="1480" cy="252" r="12" fill="#E9B44C"/><circle cx="1520" cy="252" r="12" fill="#56B47A"/><text x="1580" y="260" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800">Operations overview</text><text x="2180" y="260" text-anchor="end" fill="#CFC1D9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">LIVE</text>
    <text x="1450" y="375" fill="#4B2C70" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800">TODAY AT A GLANCE</text><g font-family="Arial,Helvetica,sans-serif"><rect x="1450" y="410" width="240" height="125" rx="20" fill="#fff"/><text x="1480" y="450" fill="#796A82" font-size="17" font-weight="700">OPEN TICKETS</text><text x="1480" y="510" fill="#E45768" font-size="54" font-weight="900">24</text><rect x="1715" y="410" width="240" height="125" rx="20" fill="#fff"/><text x="1745" y="450" fill="#796A82" font-size="17" font-weight="700">IN PROGRESS</text><text x="1745" y="510" fill="#D48215" font-size="54" font-weight="900">08</text><rect x="1980" y="410" width="240" height="125" rx="20" fill="#fff"/><text x="2010" y="450" fill="#796A82" font-size="17" font-weight="700">RESOLVED</text><text x="2010" y="510" fill="#2F9D61" font-size="54" font-weight="900">17</text></g><text x="1450" y="610" fill="#4B2C70" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800">PRIORITY QUEUE</text><g font-family="Arial,Helvetica,sans-serif"><rect x="1450" y="650" width="770" height="84" rx="18" fill="#fff"/><rect x="1480" y="675" width="108" height="32" rx="16" fill="#E45768"/><text x="1534" y="697" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">CRITICAL</text><text x="1620" y="690" fill="#24182E" font-size="22" font-weight="800">Lab G14 projector offline</text><text x="2130" y="690" text-anchor="end" fill="#796A82" font-size="17">6 min ago</text><rect x="1450" y="750" width="770" height="84" rx="18" fill="#fff"/><rect x="1480" y="775" width="108" height="32" rx="16" fill="#D48215"/><text x="1534" y="797" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">HIGH</text><text x="1620" y="790" fill="#24182E" font-size="22" font-weight="800">Wi-Fi access request</text><text x="2130" y="790" text-anchor="end" fill="#796A82" font-size="17">18 min ago</text><rect x="1450" y="850" width="770" height="84" rx="18" fill="#fff"/><rect x="1480" y="875" width="108" height="32" rx="16" fill="#2F9D61"/><text x="1534" y="897" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">MEDIUM</text><text x="1620" y="890" fill="#24182E" font-size="22" font-weight="800">Password reset support</text><text x="2130" y="890" text-anchor="end" fill="#796A82" font-size="17">42 min ago</text></g><text x="1450" y="995" fill="#796A82" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800">PRIORITY QUEUE  •  TIMERS  •  ESCALATION  •  AUDIT TRAIL</text></g>
  <rect y="1160" width="2480" height="1320" fill="#FCFAFD"/><text x="150" y="1305" fill="#4B2C70" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" letter-spacing="4">FROM FIRST REPORT TO FINAL RESOLUTION</text><text x="150" y="1405" fill="#24182E" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="900">Built around the way</text><text x="150" y="1480" fill="#24182E" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="900">support really works.</text><text x="150" y="1555" fill="#796A82" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500">Clear ownership, faster decisions and a record you can trust.</text><line x1="190" y1="1805" x2="2290" y2="1805" stroke="#D9CBE2" stroke-width="8"/>
  <g font-family="Arial,Helvetica,sans-serif"><circle cx="330" cy="1805" r="38" fill="#E45768"/><text x="330" y="1817" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">1</text><circle cx="1240" cy="1805" r="38" fill="#D48215"/><text x="1240" y="1817" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">2</text><circle cx="2150" cy="1805" r="38" fill="#2F9D61"/><text x="2150" y="1817" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">3</text><text x="330" y="1905" text-anchor="middle" fill="#24182E" font-size="30" font-weight="900">REPORT</text><text x="330" y="1955" text-anchor="middle" fill="#796A82" font-size="22">Capture the fault</text><text x="1240" y="1905" text-anchor="middle" fill="#24182E" font-size="30" font-weight="900">ROUTE</text><text x="1240" y="1955" text-anchor="middle" fill="#796A82" font-size="22">Prioritise the work</text><text x="2150" y="1905" text-anchor="middle" fill="#24182E" font-size="30" font-weight="900">RESOLVE</text><text x="2150" y="1955" text-anchor="middle" fill="#796A82" font-size="22">Close the loop</text></g>
  <g filter="url(#shadow)"><rect x="150" y="2070" width="650" height="260" rx="26" fill="#fff"/><rect x="915" y="2070" width="650" height="260" rx="26" fill="#fff"/><rect x="1680" y="2070" width="650" height="260" rx="26" fill="#fff"/></g>
  <g font-family="Arial,Helvetica,sans-serif"><rect x="200" y="2120" width="56" height="56" rx="16" fill="#F5D8DD"/><path d="M218 2141h20m-20 16h28" stroke="#E45768" stroke-width="6" stroke-linecap="round"/><text x="290" y="2156" fill="#24182E" font-size="28" font-weight="900">Reporter portal</text><text x="200" y="2225" fill="#796A82" font-size="22">Submit a fault, add context,</text><text x="200" y="2265" fill="#796A82" font-size="22">track progress and comment.</text><rect x="965" y="2120" width="56" height="56" rx="16" fill="#F7E7C8"/><path d="M982 2140h22m-22 16h28m-28 16h18" stroke="#D48215" stroke-width="6" stroke-linecap="round"/><text x="1055" y="2156" fill="#24182E" font-size="28" font-weight="900">Technician workflow</text><text x="965" y="2225" fill="#796A82" font-size="22">Claim, time, escalate, schedule</text><text x="965" y="2265" fill="#796A82" font-size="22">and resolve with confidence.</text><rect x="1730" y="2120" width="56" height="56" rx="16" fill="#D6EFDF"/><path d="M1748 2148l9 9 19-21" fill="none" stroke="#2F9D61" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="1820" y="2156" fill="#24182E" font-size="28" font-weight="900">Administrator control</text><text x="1730" y="2225" fill="#796A82" font-size="22">Search, report, manage access</text><text x="1730" y="2265" fill="#796A82" font-size="22">and keep the trail immutable.</text></g>
  <rect y="2480" width="2480" height="1028" fill="url(#footer)"/><text x="150" y="2670" fill="#4B2C70" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" letter-spacing="4">DESIGNED FOR CONTROL, SPEED AND TRUST</text><text x="150" y="2800" fill="#24182E" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900">One secure service desk</text><text x="150" y="2885" fill="#24182E" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900">for NWU.</text><text x="150" y="2970" fill="#5F4E69" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500">Visible progress for the people who need help — and the people who deliver it.</text>
  <g font-family="Arial,Helvetica,sans-serif"><rect x="150" y="3080" width="320" height="60" rx="30" fill="#4B2C70"/><text x="310" y="3118" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">FAULT CAPTURE</text><rect x="500" y="3080" width="320" height="60" rx="30" fill="#4B2C70"/><text x="660" y="3118" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">LIVE TRIAGE</text><rect x="850" y="3080" width="320" height="60" rx="30" fill="#4B2C70"/><text x="1010" y="3118" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">JOB CARDS</text><rect x="1200" y="3080" width="320" height="60" rx="30" fill="#4B2C70"/><text x="1360" y="3118" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">AUDIT TRAIL</text></g>
  <rect x="1770" y="2700" width="560" height="280" rx="30" fill="#26113f" filter="url(#shadow)"/><text x="1825" y="2785" fill="#F5C6CE" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" letter-spacing="2">THE PROMISE</text><text x="1825" y="2870" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">Every action is</text><text x="1825" y="2920" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">visible and accountable.</text><line x1="150" y1="3290" x2="2330" y2="3290" stroke="#BFAACD" stroke-width="3"/><text x="150" y="3370" fill="#4B2C70" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="900" letter-spacing="2">CSIS IT SUPPORT</text><text x="2330" y="3370" text-anchor="end" fill="#5F4E69" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">REPORT  •  ROUTE  •  RESOLVE</text>
