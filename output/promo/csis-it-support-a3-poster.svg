    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="2480" height="1160" fill="url(#hero)"/><rect width="2480" height="1160" fill="url(#heroGrid)"/>
