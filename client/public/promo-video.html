<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSIS IT Support — 60 second promo</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#d7cedd; }
    main { width:min(94vw,1280px); padding:28px; box-sizing:border-box; }
    canvas { display:block; width:100%; height:auto; border-radius:18px; box-shadow:0 24px 70px #27143f44; background:#24142f; }
    button { margin:18px auto 0; display:block; border:0; border-radius:999px; padding:14px 24px; font-weight:800; color:#fff; background:#e45768; cursor:pointer; }
    p { text-align:center; color:#4a3a54; font-size:14px; }
  </style>
</head>
<body>
<main>
  <canvas id="video" width="1280" height="720" aria-label="60 second CSIS IT Support promotional video"></canvas>
  <button id="record">Create 60-second promo video</button>
  <p id="status">A polished, caption-led product story with a light ambient soundtrack.</p>
</main>
<script>
const c=document.getElementById('video'),x=c.getContext('2d'),W=c.width,H=c.height;
const purple='#4B2C70', dark='#24142F', white='#FCFAFD', muted='#D9C9E7', coral='#E45768', green='#2F9D61', amber='#D48215', ink='#24182E';
const rr=(a,b,w,h,r,fill,stroke=null,lw=1)=>{x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke();}};
const txt=(s,a,b,z,col=white,wt=700,align='left')=>{x.font=`${wt} ${z}px Arial,Helvetica,sans-serif`;x.fillStyle=col;x.textAlign=align;x.textBaseline='alphabetic';x.fillText(s,a,b);};
const wrap=(s,a,b,max,z,lead,col=white,wt=500)=>{x.font=`${wt} ${z}px Arial,Helvetica,sans-serif`;x.fillStyle=col;let row='',yy=b;for(const q of s.split(' ')){const t=row?row+' '+q:q;if(x.measureText(t).width>max&&row){x.fillText(row,a,yy);row=q;yy+=lead;}else row=t;}if(row)x.fillText(row,a,yy);};
const line=(a,b,d,e,col='#ffffff22',w=1)=>{x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=w;x.stroke();};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let logo=new Image();logo.src='/ticket-logo.png';
function bg(light=false){const g=x.createLinearGradient(0,0,W,H);if(light){g.addColorStop(0,'#F9F5FB');g.addColorStop(1,'#E8DDF0');}else{g.addColorStop(0,'#24142F');g.addColorStop(.6,'#4B2C70');g.addColorStop(1,'#26113F');}x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.08;for(let i=-H;i<W;i+=74)line(i,0,i+H,H,'#fff',1);x.globalAlpha=1;}
function brand(light=false){if(logo.complete){x.save();x.beginPath();x.arc(62,63,30,0,Math.PI*2);x.clip();x.drawImage(logo,32,33,60,60);x.restore();}txt('CSIS IT SUPPORT',110,58,18,light?purple:'#F4C8D0',900);txt('NORTH-WEST UNIVERSITY',110,82,11,light?'#796A82':muted,700);}
function chip(s,a,b,w,col){rr(a,b,w,32,16,col);txt(s,a+w/2,b+21,10,'#fff',900,'center');}
function browserPanel(a,b,w,h,title='Operations overview'){rr(a,b,w,h,22,'#FBFAFC','#ffffff22',2);rr(a,b,w,55,22,'#28133E');x.fillStyle=coral;x.beginPath();x.arc(a+24,b+28,6,0,Math.PI*2);x.fill();x.fillStyle='#E9B44C';x.beginPath();x.arc(a+44,b+28,6,0,Math.PI*2);x.fill();x.fillStyle='#56B47A';x.beginPath();x.arc(a+64,b+28,6,0,Math.PI*2);x.fill();txt(title,a+88,b+34,14,'#fff',800);}
function metric(a,b,label,value,col){rr(a,b,132,82,14,'#fff');txt(label,a+16,b+25,9,'#796A82',800);txt(value,a+16,b+64,28,col,900);}
function footer(t,light=false){const progress=clamp(t/60000,0,1);x.fillStyle=light?'#4B2C70':'#ffffff55';x.fillRect(52,H-24,W-104,3);x.fillStyle=coral;x.fillRect(52,H-24,(W-104)*progress,3);txt('CSIS IT SUPPORT',52,H-40,11,light?purple:'#F5C6CE',900);txt('REPORT  •  ROUTE  •  RESOLVE',W-52,H-40,11,light?'#796A82':muted,700,'right');}
function intro(t){bg();brand();txt('A SERVICE DESK',72,220,18,'#F5C6CE',900);txt('Support that',72,305,58,white,900);txt('stays in motion.',72,375,58,'#F5C6CE',900);wrap('One secure place to report, route, work and resolve every request.',75,430,470,21,30,'#E6DDEE',500);chip('SEE THE WORKFLOW',75,520,190,coral);rr(770,150,395,380,24,'#1A0E25AA','#ffffff28',2);txt('THE SUPPORT LOOP',815,208,14,muted,800);const nodes=[['REPORT',coral],['ROUTE',amber],['RESOLVE',green]];nodes.forEach((n,i)=>{const xx=838+i*120;const yy=315+(i%2)*38;x.beginPath();x.arc(xx,yy,34,0,Math.PI*2);x.fillStyle=n[1];x.fill();txt(String(i+1),xx,yy+9,22,'#fff',900,'center');txt(n[0],xx,yy+76,13,white,900,'center');if(i<2)line(xx+38,yy,xx+84,315+((i+1)%2)*38,'#fff',3);});footer(t);}
function reporter(t){bg(true);brand(true);txt('01  •  CAPTURE THE CONTEXT',72,178,15,coral,900);txt('Every request starts',72,244,42,ink,900);txt('with context.',72,296,42,purple,900);wrap('Reporters submit a fault, add the details that matter and stay connected to the outcome.',74,352,430,19,27,'#796A82',500);browserPanel(620,120,570,470,'Reporter portal');txt('NEW TICKET',655,215,12,coral,900);txt('Lab G14 projector offline',655,260,22,ink,900);chip('CRITICAL',1020,235,118,coral);line(655,285,1148,285,'#24182e22',1);['Location  •  Lab G14','Category  •  Audio visual','Description  •  Projector powers on but no image','Requester  •  Amina Dlamini'].forEach((s,i)=>{txt(s,655,327+i*52,13,'#796A82',700);rr(655,342+i*52,493,28,8,'#F4EFF8');});rr(655,525,155,34,17,purple);txt('SUBMIT REQUEST',732,547,11,'#fff',900,'center');footer(t,true);}
function queue(t){bg();brand();txt('02  •  ROUTE THE WORK',72,178,15,'#F5C6CE',900);txt('Triage without',72,244,42,white,900);txt('the guesswork.',72,296,42,'#F5C6CE',900);wrap('Priority queues, ownership and clear status keep the next best action obvious.',74,352,440,19,27,muted,500);browserPanel(600,115,600,485,'Technician queue');txt('PRIORITY QUEUE',635,205,12,'#796A82',900);metric(635,230,'OPEN TICKETS','24',coral);metric(785,230,'IN PROGRESS','08',amber);metric(935,230,'RESOLVED TODAY','17',green);const cards=[['CRITICAL','Lab G14 projector offline',coral],['HIGH','Wi-Fi access request',amber],['MEDIUM','Password reset support',green]];cards.forEach((d,i)=>{const yy=345+i*70;rr(635,yy,515,54,12,'#fff');chip(d[0],650,yy+12,78,d[2]);txt(d[1],745,yy+34,13,ink,800);txt(i===0?'6m ago':i===1?'18m ago':'42m ago',1125,yy+34,11,'#796A82',700,'right');});footer(t);}
function technician(t){bg(true);brand(true);txt('03  •  DO THE WORK',72,178,15,amber,900);txt('Give technicians',72,244,42,ink,900);txt('a next step.',72,296,42,purple,900);wrap('Claim the ticket, start the timer, add notes, escalate when needed and close with confidence.',74,352,450,19,27,'#796A82',500);browserPanel(620,115,570,485,'Technician workspace');txt('JOB CARD  #1048',655,205,12,amber,900);txt('Lab G14 projector offline',655,248,23,ink,900);chip('IN PROGRESS',655,275,115,amber);txt('LIVE TIMER',655,350,11,'#796A82',800);txt('00:18:42',655,390,38,amber,900);line(655,420,1148,420,'#24182e22',1);['Requester  Amina Dlamini','Location   Lab G14','Priority   Critical'].forEach((s,i)=>txt(s,655,457+i*28,13,'#796A82',700));rr(655,540,132,34,17,coral);txt('ESCALATE',721,562,11,'#fff',900,'center');rr(800,540,144,34,17,green);txt('RESOLVE',872,562,11,'#fff',900,'center');footer(t,true);}
function schedule(t){bg();brand();txt('04  •  KEEP IT MOVING',72,178,15,'#F5C6CE',900);txt('Make the workload',72,244,42,white,900);txt('visible.',72,296,42,'#F5C6CE',900);wrap('Job cards, schedules and escalations turn a busy queue into a coordinated operation.',74,352,450,19,27,muted,500);browserPanel(600,115,600,485,'Service calendar');txt('THIS WEEK',635,205,12,muted,900);const days=['MON','TUE','WED','THU','FRI'];days.forEach((d,i)=>{const xx=635+i*100;txt(d,xx,245,11,'#796A82',900);line(xx,260,xx,540,'#24182e22',1);});const bars=[['Lab G14',coral,0,310,180],['Wi-Fi access',amber,1,380,220],['Walk-in job',green,2,275,150],['Projector check',purple,3,450,160]];bars.forEach(b=>{const xx=635+b[2]*100+8;rr(xx,b[3],b[4],36,18,b[1]);txt(b[0],xx+15,b[3]+23,11,'#fff',800);});txt('SCHEDULED  •  ESCALATED  •  RESOLVED',635,575,12,muted,800);footer(t);}
function admin(t){bg(true);brand(true);txt('05  •  SEE THE WHOLE PICTURE',72,178,15,green,900);txt('Give admins',72,244,42,ink,900);txt('full control.',72,296,42,purple,900);wrap('Search, report, manage access and protect the operational record from one command centre.',74,352,450,19,27,'#796A82',500);browserPanel(600,115,600,485,'Administrator control');txt('OPERATIONS OVERVIEW',635,205,12,purple,900);metric(635,230,'OPEN','24',coral);metric(785,230,'SLA ON TRACK','91%',green);metric(935,230,'AUDIT EVENTS','186',purple);txt('WORKLOAD BY CATEGORY',635,365,11,'#796A82',800);const bars=[['Network',78,coral],['Hardware',62,amber],['Access',48,green]];bars.forEach((b,i)=>{const yy=397+i*42;txt(b[0],635,yy+15,12,ink,700);rr(730,yy,330,20,10,'#EDE5F2');rr(730,yy,b[1]*3.3,20,10,b[2]);});txt('ROLE-BASED ACCESS  •  REPORTING  •  BACKUP EXPORT',635,555,12,'#796A82',800);footer(t,true);}
function audit(t){bg();brand();txt('06  •  CLOSE THE LOOP',72,178,15,'#F5C6CE',900);txt('Make every action',72,244,42,white,900);txt('count.',72,296,42,'#F5C6CE',900);wrap('Comments, escalations, schedules and immutable audit events make the resolution defensible.',74,352,450,19,27,muted,500);browserPanel(600,115,600,485,'Immutable audit trail');txt('AUDIT TRAIL',635,205,12,'#F5C6CE',900);const ev=[['10:42','Ticket claimed','Sebastian Klopper',amber],['10:58','Status → In progress','Timer started',purple],['11:17','Escalated','Reason recorded',coral],['12:04','Resolved','Completion note added',green]];ev.forEach((e,i)=>{const yy=250+i*72;x.beginPath();x.arc(660,yy,9,0,Math.PI*2);x.fillStyle=e[3];x.fill();if(i<3)line(660,yy+10,660,yy+62,'#4B2C70',2);txt(e[0],690,yy+5,12,'#796A82',800);txt(e[1],790,yy+5,15,ink,900);txt(e[2],790,yy+27,11,'#796A82',600);});txt('APPEND-ONLY  •  SEARCHABLE  •  ACCOUNTABLE',635,565,12,muted,800);footer(t);}
function proof(t){bg(true);brand(true);txt('07  •  THE OUTCOME',72,190,15,coral,900);txt('Less uncertainty.',72,260,48,ink,900);txt('More momentum.',72,320,48,purple,900);wrap('CSIS IT Support gives NWU teams a shared view of the request, the work and the result.',74,380,520,22,31,'#796A82',500);const cards=[['REPORT','Context arrives complete',coral],['ROUTE','Ownership stays clear',amber],['RESOLVE','The record stays strong',green]];cards.forEach((q,i)=>{const xx=650+i*175;rr(xx,235,150,185,18,'#fff');rr(xx+24,260,54,54,27,q[2]);txt(String(i+1),xx+51,295,21,'#fff',900,'center');txt(q[0],xx+24,350,12,q[2],900);wrap(q[1],xx+24,378,105,14,19,ink,800);});rr(650,470,500,84,18,'#26113f');txt('ONE VIEW OF THE WORK',680,505,14,'#F5C6CE',900);txt('for students, staff and support teams',680,530,17,'#fff',700);footer(t,true);}
function closeScene(t){bg();brand();txt('CSIS IT SUPPORT',72,220,16,'#F5C6CE',900);txt('One secure service desk',72,300,48,white,900);txt('for NWU.',72,360,48,'#F5C6CE',900);wrap('From fault report to resolution, every action is visible and accountable.',75,410,590,22,31,'#E6DDEE',500);['FAULT CAPTURE','LIVE TRIAGE','JOB CARDS','AUDIT TRAIL'].forEach((s,i)=>chip(s,75+i*175,510,150,[coral,amber,purple,green][i]));txt('REPORT  •  ROUTE  •  RESOLVE',75,620,14,muted,800);rr(900,175,285,335,24,'#1A0E25AA','#ffffff28',2);txt('THE PROMISE',940,230,13,'#F5C6CE',900);txt('Every action',940,310,30,'#fff',900);txt('is visible',940,350,30,'#fff',900);txt('and accountable.',940,390,30,'#F5C6CE',900);rr(940,435,150,36,18,coral);txt('START THE DEMO',1015,458,10,'#fff',900,'center');footer(t);}
const scenes=[intro,reporter,queue,technician,schedule,admin,audit,proof,closeScene];
function render(t){const total=60000,each=total/scenes.length;const idx=Math.min(scenes.length-1,Math.floor(t/each));const local=(t%each)/each;const fade=Math.min(1,Math.min(local*8,(1-local)*8));x.clearRect(0,0,W,H);scenes[idx](t);if(fade<1){x.fillStyle=`rgba(36,20,47,${1-fade})`;x.fillRect(0,0,W,H);}}
render(0);
let recording=false;
document.getElementById('record').onclick=async()=>{if(recording)return;recording=true;const btn=document.getElementById('record'),status=document.getElementById('status');btn.disabled=true;btn.textContent='Rendering 60-second video…';status.textContent='Keep this tab open while the full product story is rendered.';const videoStream=c.captureStream(30);let tracks=[...videoStream.getVideoTracks()];let audioContext,mediaDestination;try{audioContext=new AudioContext();mediaDestination=audioContext.createMediaStreamDestination();const master=audioContext.createGain();master.gain.value=.018;master.connect(mediaDestination);[220,277.18,329.63].forEach((freq,i)=>{const osc=audioContext.createOscillator();osc.type='sine';osc.frequency.value=freq;const gain=audioContext.createGain();gain.gain.value=i===0?.8:.5;osc.connect(gain);gain.connect(master);osc.start();});tracks=[...tracks,...mediaDestination.stream.getAudioTracks()];}catch(e){}
  const stream=new MediaStream(tracks);let mime='video/webm;codecs=vp9,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6500000});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise(resolve=>rec.onstop=resolve);const start=performance.now();rec.start(250);function tick(){const elapsed=performance.now()-start;render(Math.min(elapsed,60000));if(elapsed<60000)requestAnimationFrame(tick);else rec.stop();}requestAnimationFrame(tick);await done;audioContext?.close();const blob=new Blob(chunks,{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='csis-it-support-60-second-promo.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);btn.textContent='Video created — download again';status.textContent='60-second promo video exported as WebM with ambient soundtrack.';recording=false;};
</script>
</body>
</html>
