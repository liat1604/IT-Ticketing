services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: csis_ticketing
      POSTGRES_USER: csis_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csis_dev -d csis_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: